name: 功能建议
description: 提出新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options: [界面与交互, 主进程与调度, Codex 通道, DSH 通道, 持久化, 打包与发布, 文档]
