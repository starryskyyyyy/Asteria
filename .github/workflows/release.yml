name: Release

# 手动触发：在干净的 Windows runner 上构建安装包并上传到 GitHub Release。
# 本地构建 NSIS 时 electron-builder 需要在最后一步以静默模式运行一次刚生成的安装器来
# 导出 Uninstall.exe；在部分机器上（杀软/沙箱拦截子进程）这一步会失败，因此发布交给 CI。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布用的 tag（例如 v2.1.0），留空则使用 package.json 的版本
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Package (NSIS installer, portable exe, zip)
        run: npx electron-builder --win --x64 --publish never
        env:
          # 未配置证书时不要尝试签名；需要签名时在此加入 CSC_LINK / CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${{ inputs.tag || '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asteria-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

      - name: Publish release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Asteria ${{ inputs.tag }}
          draft: true
          files: |
            release/*.exe
            release/*.zip
